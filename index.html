<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>System Design Quiz</title>
<style>
  :root {
    --bg: #0f1117;
    --surface: #1a1d27;
    --surface2: #22263a;
    --border: #2e3250;
    --accent: #6c7bff;
    --accent2: #4ecca3;
    --text: #e8eaf6;
    --text2: #8b90b8;
    --success: #4ecca3;
    --fail: #ff6b6b;
    --font: 'Inter', system-ui, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: var(--font); min-height: 100vh; display: flex; flex-direction: column; }
  nav { background: var(--surface); border-bottom: 1px solid var(--border); padding: 0 24px; display: flex; align-items: center; gap: 16px; height: 56px; position: sticky; top: 0; z-index: 100; }
  .nav-logo { font-size: 14px; font-weight: 700; color: var(--accent); letter-spacing: 0.08em; text-transform: uppercase; margin-right: auto; }
  .nav-progress { font-size: 12px; color: var(--text2); }
  .progress-bar { width: 120px; height: 4px; background: var(--surface2); border-radius: 2px; overflow: hidden; }
  .progress-fill { height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent2)); border-radius: 2px; transition: width 0.4s ease; }
  main { flex: 1; display: flex; overflow: hidden; height: calc(100vh - 56px); }
  aside { width: 240px; background: var(--surface); border-right: 1px solid var(--border); overflow-y: auto; padding: 16px 0; flex-shrink: 0; }
  .sidebar-section { padding: 8px 16px 4px; font-size: 10px; font-weight: 700; color: var(--text2); letter-spacing: 0.12em; text-transform: uppercase; }
  .topic-btn { display: flex; align-items: center; gap: 10px; width: 100%; padding: 8px 16px; background: none; border: none; color: var(--text2); font-size: 13px; text-align: left; cursor: pointer; transition: all 0.15s; border-left: 2px solid transparent; }
  .topic-btn:hover { background: var(--surface2); color: var(--text); }
  .topic-btn.active { color: var(--accent); border-left-color: var(--accent); background: var(--surface2); }
  .topic-btn.completed { color: var(--success); }
  .topic-btn .status { margin-left: auto; font-size: 11px; }
  .content { flex: 1; overflow-y: auto; padding: 32px; display: flex; flex-direction: column; gap: 24px; }
  .home { display: flex; flex-direction: column; align-items: center; justify-content: center; flex: 1; gap: 24px; text-align: center; }
  .home h1 { font-size: 36px; font-weight: 800; letter-spacing: -0.02em; }
  .home h1 span { color: var(--accent); }
  .home p { color: var(--text2); font-size: 16px; max-width: 500px; line-height: 1.6; }
  .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; width: 100%; max-width: 500px; }
  .stat-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 20px; }
  .stat-card .num { font-size: 32px; font-weight: 800; color: var(--accent); }
  .stat-card .label { font-size: 12px; color: var(--text2); margin-top: 4px; }
  .quiz-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; }
  .topic-tag { font-size: 11px; font-weight: 700; color: var(--accent); letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 8px; }
  .quiz-title { font-size: 24px; font-weight: 700; line-height: 1.3; }
  .quiz-desc { color: var(--text2); font-size: 14px; margin-top: 8px; line-height: 1.5; }
  .reset-btn { padding: 8px 16px; background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; color: var(--text2); font-size: 13px; cursor: pointer; flex-shrink: 0; transition: all 0.15s; }
  .reset-btn:hover { border-color: var(--accent); color: var(--accent); }
  .drag-section { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 24px; }
  .drag-section h3 { font-size: 12px; font-weight: 700; color: var(--text2); letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 16px; }
  .items-bank { display: flex; flex-wrap: wrap; gap: 10px; min-height: 60px; }
  .drag-item { padding: 8px 16px; background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; font-size: 13px; cursor: grab; transition: all 0.15s; user-select: none; white-space: nowrap; }
  .drag-item:hover { border-color: var(--accent); color: var(--accent); transform: translateY(-1px); }
  .drag-item.dragging { opacity: 0.4; cursor: grabbing; }
  .drag-item.correct { background: rgba(78,204,163,0.1); border-color: var(--success); color: var(--success); cursor: default; }
  .drag-item.incorrect { background: rgba(255,107,107,0.1); border-color: var(--fail); color: var(--fail); animation: shake 0.3s ease; }
  @keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-6px)} 75%{transform:translateX(6px)} }
  .drop-zones { display: grid; gap: 16px; }
  .drop-zone-wrapper { display: flex; flex-direction: column; gap: 8px; }
  .drop-zone-label { font-size: 13px; font-weight: 600; color: var(--text); display: flex; align-items: center; gap: 8px; }
  .drop-zone-label .hint { font-size: 11px; color: var(--text2); font-weight: 400; }
  .drop-zone { min-height: 52px; border: 1.5px dashed var(--border); border-radius: 10px; padding: 10px 14px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; transition: all 0.15s; background: var(--surface2); }
  .drop-zone.drag-over { border-color: var(--accent); background: rgba(108,123,255,0.05); }
  .drop-zone-placeholder { font-size: 12px; color: var(--text2); opacity: 0.6; pointer-events: none; }

  /* GLOSSARY SECTION */
  .glossary-section { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; overflow: hidden; }
  .glossary-header { display: flex; align-items: center; justify-content: space-between; padding: 16px 24px; cursor: pointer; user-select: none; border-bottom: 1px solid transparent; transition: border-color 0.2s; }
  .glossary-header:hover { border-bottom-color: var(--border); }
  .glossary-header h3 { font-size: 12px; font-weight: 700; color: var(--text2); letter-spacing: 0.1em; text-transform: uppercase; }
  .glossary-toggle { font-size: 12px; color: var(--text2); }
  .glossary-body { display: none; padding: 0 24px 20px; }
  .glossary-body.open { display: block; }
  .glossary-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 10px; margin-top: 16px; }
  .glossary-item { background: var(--surface2); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; }
  .glossary-term { font-size: 13px; font-weight: 600; color: var(--accent2); margin-bottom: 4px; }
  .glossary-def { font-size: 12px; color: var(--text2); line-height: 1.5; }

  .feedback { display: none; padding: 16px 20px; border-radius: 12px; font-size: 14px; line-height: 1.5; }
  .feedback.show { display: block; }
  .feedback.success { background: rgba(78,204,163,0.1); border: 1px solid var(--success); color: var(--success); }
  .feedback.partial { background: rgba(255,200,100,0.1); border: 1px solid #ffc864; color: #ffc864; }
  .feedback.error { background: rgba(255,107,107,0.1); border: 1px solid var(--fail); color: var(--fail); }
  .check-btn { padding: 12px 28px; background: linear-gradient(135deg, var(--accent), #8b97ff); border: none; border-radius: 10px; color: white; font-size: 14px; font-weight: 600; cursor: pointer; transition: all 0.2s; align-self: flex-start; }
  .check-btn:hover { transform: translateY(-1px); box-shadow: 0 4px 20px rgba(108,123,255,0.3); }
  .next-btn { padding: 12px 28px; background: var(--surface2); border: 1px solid var(--border); border-radius: 10px; color: var(--text); font-size: 14px; font-weight: 600; cursor: pointer; transition: all 0.2s; display: none; }
  .next-btn.show { display: block; }
  .next-btn:hover { border-color: var(--accent2); color: var(--accent2); }
  .btn-row { display: flex; gap: 12px; align-items: center; }
  .score-badge { display: none; padding: 4px 12px; border-radius: 20px; font-size: 13px; font-weight: 700; }
  .score-badge.show { display: inline-block; }
  .score-badge.perfect { background: rgba(78,204,163,0.15); color: var(--success); }
  .score-badge.good { background: rgba(108,123,255,0.15); color: var(--accent); }
  .score-badge.retry { background: rgba(255,107,107,0.15); color: var(--fail); }
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
</style>
</head>

  <div class="nav-logo">⚡ SysDesign Quiz</div>

</nav>

  <aside id="sidebar"></aside>
  <div class="content" id="content"></div>

<script>
const topics = [
  {
    id: 'sql-nosql', category: 'System Design', title: 'SQL vs NoSQL',
    desc: 'Drag each characteristic to the correct database type.',
    zones: [
      { id: 'sql', label: 'SQL (Relational)', hint: 'e.g. PostgreSQL, MySQL' },

    ],
    items: [
      { text: 'Tables with rows and columns', zone: 'sql', def: 'SQL stores data in structured tables where every row has the same columns.' },
      { text: 'Primary and foreign keys', zone: 'sql', def: 'Keys are how SQL tables relate to each other — a foreign key in orders points to a primary key in users.' },

      { text: 'Great for high write throughput', zone: 'nosql', def: 'NoSQL databases can handle millions of writes per second — ideal for IoT telemetry or social feeds.' },
      { text: 'Eventual consistency common', zone: 'nosql', def: 'Data might not be perfectly in sync across all nodes instantly — it gets there eventually.' },
      { text: 'Each document can have different fields', zone: 'nosql', def: 'One device document might have temperature and humidity, another only battery — both valid in NoSQL.' },
    ]
  },
  {
    id: 'url-flow', category: 'System Design', title: 'URL Request Flow',
    desc: 'Put these steps in the correct order by dragging them into the sequence zones.',
    zones: [
      { id: 's1', label: 'Step 1', hint: 'First thing the browser does' },
      { id: 's2', label: 'Step 2', hint: 'If no IP cached' },
      { id: 's3', label: 'Step 3', hint: 'Establish connection' },
      { id: 's4', label: 'Step 4', hint: 'Secure the connection (HTTPS)' },
      { id: 's5', label: 'Step 5', hint: 'Send the request' },
      { id: 's6', label: 'Step 6', hint: 'Get the response' },

      { text: 'Browser sends HTTP GET request', zone: 's5', def: 'The actual request goes through the secure tunnel — includes method, headers, and optionally a body.' },
      { text: 'Server responds — browser renders page', zone: 's6', def: 'Server sends back HTML/CSS/JS in packets that the browser reassembles and renders into what you see.' },
    ]
  },
  {
    id: 'caching', category: 'System Design', title: 'Caching',
    desc: 'Drag each concept to the correct category.',
    zones: [
      { id: 'what', label: 'What caching does' },
      { id: 'hit-miss', label: 'Cache hit vs miss' },
      { id: 'strategies', label: 'Cache strategies' },
      { id: 'tools', label: 'Cache tools / examples' },
    ],
    items: [
      { text: 'Stores frequently accessed data for fast retrieval', zone: 'what', def: 'A cache holds data in fast memory so future requests get it instantly without hitting a slower database.' },
      { text: 'Avoids repeated expensive DB queries', zone: 'what', def: 'If 10,000 users request the same product page, the cache serves it from memory instead of running 10,000 DB queries.' },

      { text: 'Active invalidation — delete on data change', zone: 'strategies', def: 'When underlying data changes, immediately delete the cache entry so stale data isnt served.' },

      { text: 'Redis — external in-memory cache', zone: 'tools', def: 'A standalone caching service that lives outside your app — fast, supports TTL, used by most production systems.' },
      { text: 'In-memory cache — lives inside the app', zone: 'tools', def: 'Cache stored in the apps own memory — fastest possible but lost if the app restarts.' },

  {
    id: 'message-queues', category: 'System Design', title: 'Message Queues',

      { id: 'queue', label: 'Queue / Broker' },
      { id: 'dlq', label: 'Dead Letter Queue' },
      { id: 'benefits', label: 'Key Benefits' },
    ],
    items: [
      { text: 'Publishes events / messages', zone: 'producer', def: 'A producer is any service that sends a message into the queue — it publishes and moves on.' },
      { text: 'Service that triggers the message', zone: 'producer', def: 'The thing that causes the message to exist — an order being placed, a device publishing telemetry.' },
      { text: 'Reads and processes messages', zone: 'consumer', def: 'A consumer subscribes to a queue or topic and reacts to each message it receives.' },
      { text: 'Reacts to events independently', zone: 'consumer', def: 'Each consumer operates on its own — one consumer failing doesnt stop others from processing.' },
      { text: 'Holds messages in FIFO order', zone: 'queue', def: 'First In First Out — messages are processed in the order they were received.' },
      { text: 'Kafka, Azure Service Bus', zone: 'queue', def: 'Popular message broker systems — Kafka is used in your current IoT work.' },
      { text: 'Where failed messages land for retry', zone: 'dlq', def: 'If a consumer fails to process a message after X retries, it goes to the DLQ so nothing is lost.' },
      { text: 'Prevents message loss on consumer failure', zone: 'dlq', def: 'DLQ acts as a safety net — failed messages wait there until someone investigates and reprocesses them.' },
      { text: 'Decouples services from each other', zone: 'benefits', def: 'Services dont need to know about each other — they just publish and consume events independently.' },
      { text: 'Async — producer doesnt wait', zone: 'benefits', def: 'The producer fires a message and immediately moves on without waiting for consumers to finish.' },
      { text: 'Resilient — messages survive downtime', zone: 'benefits', def: 'If a consumer goes down, messages queue up and get processed when it comes back online.' },
    ]
  },
  {
    id: 'scaling', category: 'System Design', title: 'Horizontal vs Vertical Scaling',
    desc: 'Sort these into the correct scaling type.',
    zones: [
      { id: 'vertical', label: 'Vertical Scaling (Scale Up)' },
      { id: 'horizontal', label: 'Horizontal Scaling (Scale Out)' },
    ],
    items: [
      { text: 'Add more CPU and RAM to one machine', zone: 'vertical', def: 'Vertical scaling makes a single server more powerful — bigger CPU, more memory, faster disk.' },
      { text: 'Simple — no load balancer needed', zone: 'vertical', def: 'One machine means no traffic distribution complexity — just a bigger box.' },
      { text: 'Hard physical ceiling', zone: 'vertical', def: 'There is a maximum amount of CPU and RAM you can fit in one machine — you will eventually hit it.' },
      { text: 'Single point of failure', zone: 'vertical', def: 'If that one powerful machine goes down, everything goes down with it.' },

      { text: 'Needs a load balancer', zone: 'horizontal', def: 'With multiple machines you need something to distribute incoming traffic evenly across them.' },
      { text: 'No single point of failure', zone: 'horizontal', def: 'If one server goes down the others keep serving traffic — much more resilient.' },
      { text: 'App must be stateless', zone: 'horizontal', def: 'Any server must be able to handle any request — session data cant live on one specific machine.' },
      { text: 'Preferred by large scale systems', zone: 'horizontal', def: 'Twitter, Netflix, and Amazon all use horizontal scaling — its how internet-scale is achieved.' },
    ]
  },
  {
    id: 'load-balancers', category: 'System Design', title: 'Load Balancers',
    desc: 'Match each concept to the correct category.',
    zones: [
      { id: 'what', label: 'What a load balancer does' },
      { id: 'strategies', label: 'Routing strategies' },
      { id: 'ha', label: 'High availability setup' },
    ],
    items: [
      { text: 'Distributes traffic across multiple servers', zone: 'what', def: 'The load balancer sits in front of your servers and sends each incoming request to one of them.' },
      { text: 'Removes unhealthy servers from rotation', zone: 'what', def: 'Using heartbeat health checks, the LB stops sending traffic to servers that are down.' },
      { text: 'Eliminates single point of failure at app layer', zone: 'what', def: 'If any one server dies, the LB routes around it and other servers absorb the load.' },
      { text: 'Round robin — rotate evenly 1,2,3,1,2,3', zone: 'strategies', def: 'Each request goes to the next server in sequence — simple and even distribution.' },
      { text: 'Least connections — route to least busy', zone: 'strategies', def: 'Send each new request to whichever server currently has the fewest active connections.' },
      { text: 'IP hashing — same user hits same server', zone: 'strategies', def: 'Hash the users IP address to always route them to the same server — useful for session consistency.' },
      { text: 'Active-passive failover — backup LB on standby', zone: 'ha', def: 'Two load balancers run — one active, one passive. If the active fails the passive takes over automatically.' },
      { text: 'Heartbeat checks detect downed servers', zone: 'ha', def: 'The LB pings each server periodically — no response means it removes that server from rotation.' },
    ]
  },
  {
    id: 'sync-async', category: 'System Design', title: 'Sync vs Async',

      { id: 'sync', label: 'Synchronous — caller waits' },
      { id: 'async', label: 'Asynchronous — fire and forget' },
    ],
    items: [
      { text: 'User login — check password before proceeding', zone: 'sync', def: 'Auth must succeed or fail before the app knows what to do next — it has to wait.' },
      { text: 'Payment processing — must succeed before confirming order', zone: 'sync', def: 'You cannot confirm an order until you know the payment went through — synchronous by necessity.' },
      { text: 'Fetching user profile to display on screen', zone: 'sync', def: 'The page cant render without the data — the request must complete before the UI can update.' },
      { text: 'Auth check — cant proceed without yes or no', zone: 'sync', def: 'Everything downstream depends on knowing if the user is authenticated — you have to wait.' },

  },

let completed = new Set();
let currentTopic = null;
let draggedItem = null;
let glossaryOpen = false;

function updateProgress() {
  const pct = Math.round((completed.size / topics.length) * 100);
  document.getElementById('progressText').textContent = `${completed.size} / ${topics.length} completed`;
  document.getElementById('progressFill').style.width = pct + '%';
  renderSidebar();
}

function renderSidebar() {
  const sidebar = document.getElementById('sidebar');
  const categories = [...new Set(topics.map(t => t.category))];
  sidebar.innerHTML = categories.map(cat => {
    const catTopics = topics.filter(t => t.category === cat);
    return `
      <div class="sidebar-section">${cat}</div>
      ${catTopics.map(t => `
        <button class="topic-btn ${currentTopic?.id === t.id ? 'active' : ''} ${completed.has(t.id) ? 'completed' : ''}"
          onclick="loadTopic('${t.id}')">
          ${t.title}
          <span class="status">${completed.has(t.id) ? '✓' : ''}</span>
        </button>
      `).join('')}
    `;
  }).join('');
}

function loadTopic(id) {
  currentTopic = topics.find(t => t.id === id);
  glossaryOpen = false;
  renderTopic();
  renderSidebar();
}

function renderTopic() {
  const t = currentTopic;
  const shuffled = [...t.items].sort(() => Math.random() - 0.5);
  const cols = t.zones.length <= 3 ? t.zones.length : 2;

  document.getElementById('content').innerHTML = `
    <div class="quiz-header">
      <div>
        <div class="topic-tag">${t.category}</div>
        <div class="quiz-title">${t.title}</div>
        <div class="quiz-desc">${t.desc}</div>
      </div>
      <button class="reset-btn" onclick="loadTopic('${t.id}')">↺ Reset</button>
    </div>

    <div class="drag-section">
      <h3>Drag these items</h3>
      <div class="items-bank" id="bank">
        ${shuffled.map((item, i) => `
          <div class="drag-item" draggable="true" data-idx="${i}" data-text="${escAttr(item.text)}" data-zone="${item.zone}"
            ondragstart="onDragStart(event)" ondragend="onDragEnd(event)">
            ${item.text}
          </div>
        `).join('')}
      </div>
    </div>

    <div class="drag-section">
      <h3>Drop zones</h3>
      <div class="drop-zones" style="grid-template-columns: repeat(${cols}, 1fr)">
        ${t.zones.map(zone => `
          <div class="drop-zone-wrapper">
            <div class="drop-zone-label">
              ${zone.label}
              ${zone.hint ? `<span class="hint">— ${zone.hint}</span>` : ''}
            </div>
            <div class="drop-zone" id="zone-${zone.id}"
              ondragover="onDragOver(event)" ondragleave="onDragLeave(event)" ondrop="onDrop(event,'${zone.id}')">
              <span class="drop-zone-placeholder">Drop items here</span>
            </div>
          </div>
        `).join('')}
      </div>
    </div>

    <!-- GLOSSARY -->
    <div class="glossary-section">
      <div class="glossary-header" onclick="toggleGlossary()">
        <h3>📖 Term definitions — click to ${glossaryOpen ? 'hide' : 'show'}</h3>
        <span class="glossary-toggle">${glossaryOpen ? '▲ hide' : '▼ show'}</span>
      </div>
      <div class="glossary-body ${glossaryOpen ? 'open' : ''}" id="glossaryBody">
        <div class="glossary-grid">
          ${t.items.map(item => `
            <div class="glossary-item">
              <div class="glossary-term">${item.text}</div>
              <div class="glossary-def">${item.def}</div>
            </div>
          `).join('')}
        </div>
      </div>
    </div>

    <div class="feedback" id="feedback"></div>

    <div class="btn-row">
      <button class="check-btn" onclick="checkAnswers()">Check answers</button>
      <button class="next-btn" id="nextBtn" onclick="goNext()">Next topic →</button>
      <span class="score-badge" id="scoreBadge"></span>
    </div>
  `;
}

function toggleGlossary() {
  glossaryOpen = !glossaryOpen;
  const body = document.getElementById('glossaryBody');
  const header = body.previousElementSibling;
  body.classList.toggle('open', glossaryOpen);
  header.querySelector('h3').textContent = `📖 Term definitions — click to ${glossaryOpen ? 'hide' : 'show'}`;
  header.querySelector('.glossary-toggle').textContent = glossaryOpen ? '▲ hide' : '▼ show';
}

function escAttr(str) {
  return str.replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

function onDragStart(e) {
  draggedItem = e.target;
  e.target.classList.add('dragging');
  e.dataTransfer.effectAllowed = 'move';
}

function onDragEnd(e) { e.target.classList.remove('dragging'); }

function onDragOver(e) {
  e.preventDefault();
  e.currentTarget.classList.add('drag-over');
}

function onDragLeave(e) { e.currentTarget.classList.remove('drag-over'); }

function onDrop(e, zoneId) {
  e.preventDefault();
  e.currentTarget.classList.remove('drag-over');
  if (!draggedItem) return;

  const placeholder = e.currentTarget.querySelector('.drop-zone-placeholder');
  if (placeholder) placeholder.remove();

  const clone = document.createElement('div');
  clone.className = 'drag-item';
  clone.textContent = draggedItem.dataset.text;
  clone.dataset.text = draggedItem.dataset.text;
  clone.dataset.zone = draggedItem.dataset.zone;
  clone.draggable = true;
  clone.ondragstart = onDragStart;
  clone.ondragend = onDragEnd;
  e.currentTarget.appendChild(clone);

  draggedItem.remove();
  draggedItem = null;
}

function checkAnswers() {
  let correct = 0;
  const total = currentTopic.items.length;

  currentTopic.zones.forEach(zone => {
    const zoneEl = document.getElementById(`zone-${zone.id}`);
    zoneEl.querySelectorAll('.drag-item').forEach(item => {
      if (item.dataset.zone === zone.id) {
        item.classList.add('correct');
        item.classList.remove('incorrect');
        correct++;
      } else {
        item.classList.add('incorrect');
        item.classList.remove('correct');
        setTimeout(() => item.classList.remove('incorrect'), 400);
      }
    });
  });

  const bank = document.getElementById('bank');
  const unplaced = bank.querySelectorAll('.drag-item').length;
  const feedback = document.getElementById('feedback');
  const scoreBadge = document.getElementById('scoreBadge');
  const nextBtn = document.getElementById('nextBtn');
  const pct = Math.round((correct / total) * 100);

  if (correct === total && unplaced === 0) {
    feedback.className = 'feedback show success';
    feedback.innerHTML = `<strong>🎉 Perfect!</strong> All ${total} items correctly placed.`;
    scoreBadge.className = 'score-badge show perfect';
    scoreBadge.textContent = `${correct}/${total} — Perfect`;
    completed.add(currentTopic.id);
    updateProgress();
  } else if (pct >= 70) {
    feedback.className = 'feedback show partial';
    feedback.innerHTML = `<strong>Almost there!</strong> ${correct}/${total} correct. Check highlighted items — definitions below might help.`;
    scoreBadge.className = 'score-badge show good';
    scoreBadge.textContent = `${correct}/${total}`;
    if (!glossaryOpen) { glossaryOpen = true; toggleGlossary(); }
  } else {
    feedback.className = 'feedback show error';
    feedback.innerHTML = `<strong>Keep going!</strong> ${correct}/${total} correct. Check the definitions section below and try again.`;
    scoreBadge.className = 'score-badge show retry';
    scoreBadge.textContent = `${correct}/${total} — Review needed`;
    if (!glossaryOpen) { glossaryOpen = true; toggleGlossary(); }
  }

  nextBtn.classList.add('show');
}

function goNext() {
  const idx = topics.findIndex(t => t.id === currentTopic.id);
  loadTopic(topics[(idx + 1) % topics.length].id);
}

function renderHome() {
  document.getElementById('content').innerHTML = `
    <div class="home">
      <div>
        <div class="topic-tag">System Design Interview Prep</div>
        <h1>Drag & Drop <span>Quiz</span></h1>
        <p>Reinforce your system design knowledge by dragging concepts to the right categories. Pick a topic from the sidebar to start. Each page has a definitions section at the bottom to help when you get stuck.</p>
      </div>
      <div class="stats-grid">
        <div class="stat-card"><div class="num">${topics.length}</div><div class="label">Total topics</div></div>
        <div class="stat-card"><div class="num" id="homeCompleted">0</div><div class="label">Completed</div></div>
        <div class="stat-card"><div class="num" id="homePct">0%</div><div class="label">Mastered</div></div>
      </div>
      <button class="check-btn" onclick="loadTopic('${topics[0].id}')">Start first topic →</button>
    </div>
  `;
}

renderHome();
renderSidebar();
</script>
